[project]
name = "solaris"
version = "0.1.0"
description = "Solar-aware GNOME theme orchestration utility for Arch Linux"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astral>=3.2",
    "pygobject>=3.56.3",
    "pyxdg>=0.28",
]

[project.scripts]
solaris = "solaris.cli:main"

[project.gui-scripts]
solaris-gui = "solaris.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning:astral.*",
]

[tool.coverage.run]
source = ["solaris"]
omit = [
    "solaris/app.py",
    "solaris/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
